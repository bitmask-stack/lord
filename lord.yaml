# example config
#
# Data layout (heed3 LMDB + Carbonado blobs):
#   {data_dir}/index/              — cardinal block index (mainnet)
#   {data_dir}/{chain}/index/      — cardinal block index (other chains)
#   {data_dir}/wallets/<name>/     — per-wallet LMDB env (not <name>.redb)
#   {data_dir}/carbonado/          — Carbonado blob files ({bao_root}.c{NN})
#   {data_dir}/filepack/           — filepack manifest directories
#   {data_dir}/storage/            — commitment metadata LMDB (no blob bytes)

# see `lord --help` for setting documentation

bitcoin_data_dir: /var/lib/bitcoin
bitcoin_rpc_password: bar
bitcoin_rpc_url: https://localhost:8000
bitcoin_rpc_username: foo
chain: mainnet
commit_interval: 10000
config: /var/lib/lord/lord.yaml
config_dir: /var/lib/lord
cookie_file: /var/lib/bitcoin/.cookie
data_dir: /var/lib/lord
height_limit: 1000
index: /var/lib/lord/index
index_addresses: true
index_cache_size: 1000000000
index_sats: true
integration_test: true
server_password: bar
server_url: http://localhost:8888
server_username: foo
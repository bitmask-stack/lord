# example config (ord compatibility)
#
# Prefer lord.yaml for new deployments. Settings probes lord.yaml first, then
# falls back to ord.yaml; see docs/src/lord/implementation.md.
#
# Wallet path: {data_dir}/wallets/<name>/ (heed3 LMDB directory, not <name>.redb)

# see `lord --help` for setting documentation

bitcoin_data_dir: /var/lib/bitcoin
bitcoin_rpc_password: bar
bitcoin_rpc_url: https://localhost:8000
bitcoin_rpc_username: foo
chain: mainnet
commit_interval: 10000
config: /var/lib/ord/ord.yaml
config_dir: /var/lib/ord
cookie_file: /var/lib/bitcoin/.cookie
data_dir: /var/lib/ord
height_limit: 1000
index: /var/lib/ord/index
index_addresses: true
index_cache_size: 1000000000
index_sats: true
integration_test: true
server_password: bar
server_url: http://localhost:8888
server_username: foo

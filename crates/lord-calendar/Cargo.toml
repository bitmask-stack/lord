[package]
name = "lord-calendar"
version = "0.1.0"
description = "Embedded OpenTimestamps calendar for Lord"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.90"
axum = "0.8.1"
bitcoin = { workspace = true }
bitcoincore-rpc = "0.19.0"
hex.workspace = true
log = "0.4.14"
lord-ltp = { path = "../lord-ltp" }
lord-storage = { path = "../lord-storage" }
opentimestamps = "0.2.0"
parking_lot = "0.12"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1.43.0", features = ["rt-multi-thread", "sync", "time", "macros"] }
tower-http = { version = "0.6.2", features = ["cors"] }

[dev-dependencies]
lord-commit = { path = "../lord-commit" }
mockcore = { path = "../mockcore" }
tempfile.workspace = true
tower = { version = "0.5.2", features = ["util"] }
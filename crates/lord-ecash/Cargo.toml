[package]
name = "lord-ecash"
version = "0.1.0"
description = "Cashu ecash wallet wrapper for Lord (Track C3 skeleton)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.90"
log = "0.4.14"
cdk = "0.17"
cdk-sqlite = "0.17"
hex.workspace = true
lord-payments = { path = "../lord-payments" }
rand = "0.9.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror = "2.0.12"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
cdk-fake-wallet = "0.17"
cdk-sqlite = "0.17"
rand = "0.9.1"
tempfile.workspace = true
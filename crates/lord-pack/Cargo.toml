[package]
name = "lord-pack"
version = "0.1.0"
description = "Thin helper binary for Lord filepack manifest creation"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "lord-pack"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.90"
clap = { version = "4.4.2", features = ["derive", "env"] }
dirs = "6.0.0"
lord-storage = { path = "../lord-storage" }
serde_json.workspace = true
name: CI

on:
  push:
    branches:
    - master
    - lord
  pull_request:
    branches:
    - master
    - lord

defaults:
  run:
    shell: bash

env:
  RUSTFLAGS: --deny warnings

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install Rust Toolchain Components
      uses: actions-rs/toolchain@v1
      with:
        override: true
        toolchain: stable

    - uses: Swatinem/rust-cache@v2

    - name: Install `mdbook`
      run: cargo install mdbook@0.4.52

    - name: Install `mdbook-i18n-helpers`
      run: cargo install mdbook-i18n-helpers@0.3.6

    - name: Install `mdbook-linkcheck`
      run: cargo install mdbook-linkcheck@0.7.7

    - name: Build docs
      run: mdbook build docs -d build

    - name: Build all translations for docs
      env:
        LANGUAGES: de fr es pt ru zh ja ko fil ar hi it nl
      run: |
        for lang in ${{ env.LANGUAGES }}; do
          echo "::group::Building $lang translation"
          MDBOOK_BOOK__LANGUAGE=$lang \
            mdbook build docs -d build/$lang
          mv docs/build/$lang/html docs/build/html/$lang
          echo "::endgroup::"
        done

    - name: Deploy Pages
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/master'
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        publish_branch: gh-pages
        publish_dir: docs/build/html

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust Toolchain Components
      uses: actions-rs/toolchain@v1
      with:
        components: clippy, rustfmt
        override: true
        toolchain: stable

    - uses: Swatinem/rust-cache@v2

    - name: Clippy
      run: cargo clippy --all --all-targets

    - name: Format
      run: cargo fmt --all -- --check

    - name: Check for Forbidden Words
      run: |
        sudo apt-get install ripgrep
        ./bin/forbid

  test:
    strategy:
      matrix:
        os:
        - macos-latest
        - ubuntu-latest
        - windows-latest

    runs-on: ${{matrix.os}}

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust Toolchain Components
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable

    - uses: Swatinem/rust-cache@v2

    - name: Smoke (calendar + commit dry-run)
      run: cargo test --test integration smoke:: -- --nocapture

    - name: P2P smoke (Iroh loopback gossip)
      run: cargo test -p lord-iroh --test loopback_gossip -- --nocapture --test-threads=1

    - name: Test
      run: cargo test --all

  lightning:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust Toolchain Components
      uses: actions-rs/toolchain@v1
      with:
        components: clippy
        profile: minimal
        toolchain: stable

    - uses: Swatinem/rust-cache@v2

    - name: Test lord-lightning
      run: cargo test -p lord-lightning

    - name: Lightning integration smoke
      run: cargo test --test integration smoke::lightning_status_smoke --features lightning -- --nocapture

    - name: Clippy lord-lightning
      run: cargo clippy -p lord-lightning -- -D warnings

    - name: Compile lord with lightning feature
      run: cargo test -p lord --features lightning --no-run

  ecash:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust Toolchain Components
      uses: actions-rs/toolchain@v1
      with:
        components: clippy
        profile: minimal
        toolchain: stable

    - uses: Swatinem/rust-cache@v2

    - name: Test lord-payments
      run: cargo test -p lord-payments

    - name: Test lord-ecash
      run: cargo test -p lord-ecash

    - name: Test lord-market
      run: cargo test -p lord-market

    - name: Ecash integration smoke (disabled)
      run: cargo test --test integration smoke::ecash_status_smoke --features ecash -- --exact --nocapture

    - name: Ecash integration smoke (enabled)
      run: cargo test --test integration smoke::ecash_status_smoke_enabled --features ecash -- --exact --nocapture

    - name: Clippy payment crates
      run: cargo clippy -p lord-payments -p lord-ecash -p lord-market -- -D warnings

    - name: Compile lord with ecash feature
      run: cargo test -p lord --features ecash --no-run

  ecash-lightning:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust Toolchain Components
      uses: actions-rs/toolchain@v1
      with:
        components: clippy
        profile: minimal
        toolchain: stable

    - uses: Swatinem/rust-cache@v2

    - name: Settlement smoke
      run: |
        cargo test -p lord-payments
        cargo test -p lord-ecash
        cargo test -p lord-market settlement::tests:: -- --nocapture
        cargo test -p lord-lightning payments::tests::lightning_invoice_smoke -- --exact --nocapture

    - name: Market invoice integration smoke
      run: cargo test --test integration smoke::market_invoice_smoke --features ecash-lightning -- --exact --nocapture

    - name: Clippy payment + lightning crates
      run: |
        cargo clippy -p lord-payments -p lord-ecash -p lord-lightning -- -D warnings
        cargo clippy -p lord-market --features ecash-lightning -- -D warnings

    - name: Compile lord with ecash-lightning feature
      run: cargo test -p lord --features ecash-lightning --no-run
